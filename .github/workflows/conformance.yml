on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 3'

permissions:
  contents: read

name: Conformance
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout conformance client
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run test suite
        uses: theupdateframework/tuf-conformance@v2.5.0
        with:
          entrypoint: ".github/scripts/conformance-client.py"
